name: Shell tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [dash, bash, 'busybox sh']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install BusyBox
        if: matrix.shell == 'busybox sh'
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Check shell syntax
        run: |
          ${{ matrix.shell }} -n files/etc/init.d/passwall-recovery
          ${{ matrix.shell }} -n installer.sh
          ${{ matrix.shell }} -n files/etc/passwall-recovery/cloud-direct/passwall-cloud-direct
          bash -n scripts/build-release.sh
          bash -n cloud-client/install.sh
      - name: Test recovery and cloud routing
        run: |
          ${{ matrix.shell }} tests/test-recovery.sh
          ${{ matrix.shell }} tests/test-cloud-direct.sh
          bash tests/test-cloud-client.sh

  release-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch verified base payload
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/base.tar.gz" \
            https://github.com/guajun/gl-be6500-passwall-recovery/releases/download/v1.0.2/gl-be6500-passwall-recovery-v1.0.2.tar.gz
          echo "2e6d96bae0278b4b3dd1eb8b3c3ee0e57b2902acae5a9be591c3223803dfd8c5  $RUNNER_TEMP/base.tar.gz" | sha256sum -c -
      - name: Build and verify release bundles
        run: |
          bash scripts/build-release.sh "$RUNNER_TEMP/base.tar.gz" dist/v1.0.3 v1.0.3
          bash tests/test-release.sh dist/v1.0.3
